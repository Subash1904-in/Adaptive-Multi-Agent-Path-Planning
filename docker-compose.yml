# ==============================================================================
# AMAPP Docker Compose Orchestration (Phase 39)
# Multi-container orchestration: Daphne ASGI Backend + Nginx Reverse Proxy Frontend
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: amapp-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-ci-deployment-smoke-verification-secret-key-32chars}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-backend,localhost,127.0.0.1,frontend,web}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      - AMAPP_WS_ALLOWED_ORIGINS=${AMAPP_WS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      - AMAPP_DATA_DIR=/app/data
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      - backend-data:/app/data
    networks:
      - amapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: amapp-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - amapp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

volumes:
  backend-data:
    name: amapp-backend-data

networks:
  amapp-network:
    name: amapp-network
    driver: bridge
