name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene & Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Mandatory Documents & Phase Artifacts Exist
        shell: bash
        run: |
          REQUIRED_FILES=(
            "README.md"
            "PROJECT_STATUS.md"
            "ARCHITECTURE.md"
            "REQUIREMENTS_TRACEABILITY.md"
            ".gitignore"
            "docs/API.md"
            "docs/TESTING.md"
            "docs/progress/PHASE_01.md"
            "docs/progress/PHASE_02.md"
            "docs/progress/PHASE_03.md"
            "docs/progress/PHASE_04.md"
            "docs/progress/PHASE_05.md"
            "docs/progress/PHASE_06.md"
            "docs/progress/PHASE_07.md"
            "docs/progress/PHASE_08.md"
            "docs/progress/PHASE_09.md"
            "docs/progress/PHASE_10.md"
            "docs/progress/PHASE_11.md"
            "docs/progress/PHASE_12.md"
            "docs/progress/PHASE_13.md"
            "docs/progress/PHASE_14.md"
            "docs/progress/PHASE_15.md"
            "docs/progress/PHASE_16.md"
            "docs/progress/PHASE_17.md"
            "docs/progress/PHASE_18.md"
            "docs/progress/PHASE_19.md"
            "docs/progress/PHASE_20.md"
            "docs/progress/PHASE_21.md"
            "docs/progress/PHASE_22.md"
            "docs/progress/PHASE_23.md"
            "docs/progress/PHASE_24.md"
            "docs/progress/PHASE_25.md"
            "docs/progress/PHASE_26.md"
            "docs/progress/PHASE_27.md"
            "docs/progress/PHASE_28.md"
            "docs/progress/PHASE_29.md"
            "docs/progress/PHASE_30.md"
            "docs/progress/PHASE_31.md"
            "docs/progress/PHASE_32.md"
            "docs/progress/PHASE_33.md"
            "docs/progress/PHASE_34.md"
            "docs/progress/PHASE_35.md"
            "docs/progress/PHASE_36.md"
            "pytest.ini"
            "requirements.txt"
            "requirements-dev.txt"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing mandatory project documentation file or artifact: $file"
              exit 1
            fi
            echo "Verified present: $file"
          done

      - name: Scan for Secret Leaks or Prohibited Artifacts
        shell: bash
        run: |
          echo "Scanning workspace for prohibited binary and secret patterns..."
          PROHIBITED_EXTENSIONS=("*.key" "*.pem" "*.p12" "*.pkcs12" "*.sqlite3")
          FOUND=0
          for ext in "${PROHIBITED_EXTENSIONS[@]}"; do
            MATCHES=$(find . -not -path "*/.*" -name "$ext")
            if [ -n "$MATCHES" ]; then
              echo "::error::Prohibited file found: $MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No prohibited files or secrets detected."

  backend-quality:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Runtime & Development Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Verify Environment & Installed Dependencies
        shell: bash
        run: |
          python -c "import sys, django, rest_framework, channels, daphne, pytest_asyncio, networkx, osmnx, pytest, pytest_cov, ruff, gymnasium, torch, stable_baselines3, sb3_contrib; print(f'Environment verification:\n- Python: {sys.version}\n- Django: {django.__version__}\n- DRF: {rest_framework.__version__}\n- Channels: {channels.__version__}\n- Daphne: {daphne.__version__}\n- Pytest-Asyncio: {pytest_asyncio.__version__}\n- NetworkX: {networkx.__version__}\n- OSMnx: {osmnx.__version__}\n- Pytest: {pytest.__version__}\n- Pytest-Cov: {pytest_cov.__version__}\n- Gymnasium: {gymnasium.__version__}\n- PyTorch: {torch.__version__}\n- Stable-Baselines3: {stable_baselines3.__version__}\n- SB3-Contrib: {sb3_contrib.__version__}')"

      - name: Run Ruff Linting
        shell: bash
        run: |
          ruff check backend

      - name: Run Django System Checks
        shell: bash
        run: |
          python backend/manage.py check

      - name: Verify Django Migrations and Database Schema
        shell: bash
        run: |
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate

      - name: Verify Experiment History & Persistence Integrity
        shell: bash
        run: |
          python backend/manage.py shell -c "from apps.core.models import SimulationRun, BenchmarkConfiguration, BenchmarkTrial, ExperimentMetric; print('Phase 35 models successfully verified in Django environment.')"

      - name: Verify Security Hardening & Safe Containment Configuration
        shell: bash
        run: |
          python backend/manage.py shell -c "from config import settings; assert settings.DATA_UPLOAD_MAX_MEMORY_SIZE == 5242880; from apps.core.api.permissions import SimulationApiPermission; from apps.core.rl.model_manager import is_safe_contained_path; print('Phase 36 security settings and policies verified.')"

      - name: Run Full Automated Test Suite with Coverage (Phases 2-22, WebSockets, Channels ASGI)
        shell: bash
        run: |
          pytest --cov=backend/apps/core --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Run Reproducible Routing Benchmark Smoke Verification
        shell: bash
        run: |
          python backend/manage.py run_benchmark --smoke

      - name: Run Gymnasium RL Environment Smoke Verification
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from apps.core.rl.env import AMAPPSingleAgentEnv; from gymnasium.utils.env_checker import check_env; env = AMAPPSingleAgentEnv(); check_env(env); print('RL Environment check_env smoke test PASSED')"

      - name: Run RL Baseline Training Smoke Verification
        shell: bash
        run: |
          python backend/manage.py train_rl_baseline --smoke

      - name: Run Learned RL Policy & Safe Fallback Benchmark Smoke Verification
        shell: bash
        run: |
          python backend/manage.py run_benchmark --algorithms learned --scenarios bench_grid_sparse_3x3,bench_infeasible_barrier --trials 1 --seed 42



  frontend-quality:
    name: Frontend Lint, Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies (Reproducible npm ci)
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linting (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Frontend Unit Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Run Production Bundle Build (Vite)
        working-directory: frontend
        run: npm run build


