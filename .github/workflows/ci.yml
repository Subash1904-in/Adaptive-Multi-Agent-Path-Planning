name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene & Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Mandatory Documents Exist
        shell: bash
        run: |
          REQUIRED_FILES=(
            "README.md"
            "PROJECT_STATUS.md"
            "ARCHITECTURE.md"
            "REQUIREMENTS_TRACEABILITY.md"
            ".gitignore"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing mandatory project documentation file: $file"
              exit 1
            fi
            echo "Verified present: $file"
          done

      - name: Scan for Secret Leaks or Prohibited Artifacts
        shell: bash
        run: |
          echo "Scanning workspace for prohibited binary and secret patterns..."
          PROHIBITED_EXTENSIONS=("*.key" "*.pem" "*.p12" "*.pkcs12" "*.sqlite3")
          FOUND=0
          for ext in "${PROHIBITED_EXTENSIONS[@]}"; do
            MATCHES=$(find . -not -path "*/.*" -name "$ext")
            if [ -n "$MATCHES" ]; then
              echo "::error::Prohibited file found: $MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No prohibited files or secrets detected."

  backend-quality:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linting
        shell: bash
        run: |
          ruff check backend

      - name: Run Django System Checks
        shell: bash
        run: |
          python backend/manage.py check

      - name: Run Automated Test Suite
        shell: bash
        run: |
          pytest

  frontend-quality:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Inspect Frontend & Validate
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
            npm run lint
            npm run typecheck
            npm run build
          else
            echo "Phase 0 scaffold verified: No frontend/package.json declared yet. Node 22.x environment verified."
          fi
