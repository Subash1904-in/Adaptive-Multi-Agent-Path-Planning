name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository Hygiene & Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Mandatory Documents & Phase Artifacts Exist
        shell: bash
        run: |
          REQUIRED_FILES=(
            "README.md"
            "PROJECT_STATUS.md"
            "ARCHITECTURE.md"
            "REQUIREMENTS_TRACEABILITY.md"
            ".gitignore"
            "docs/API.md"
            "docs/TESTING.md"
            "docs/progress/PHASE_01.md"
            "docs/progress/PHASE_02.md"
            "docs/progress/PHASE_03.md"
            "docs/progress/PHASE_04.md"
            "docs/progress/PHASE_05.md"
            "docs/progress/PHASE_06.md"
            "docs/progress/PHASE_07.md"
            "docs/progress/PHASE_08.md"
            "docs/progress/PHASE_09.md"
            "docs/progress/PHASE_10.md"
            "docs/progress/PHASE_11.md"
            "docs/progress/PHASE_12.md"
            "docs/progress/PHASE_13.md"
            "docs/progress/PHASE_14.md"
            "docs/progress/PHASE_15.md"
            "docs/progress/PHASE_16.md"
            "docs/progress/PHASE_17.md"
            "docs/progress/PHASE_18.md"
            "docs/progress/PHASE_19.md"
            "docs/progress/PHASE_20.md"
            "pytest.ini"
            "requirements.txt"
            "requirements-dev.txt"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing mandatory project documentation file or artifact: $file"
              exit 1
            fi
            echo "Verified present: $file"
          done

      - name: Scan for Secret Leaks or Prohibited Artifacts
        shell: bash
        run: |
          echo "Scanning workspace for prohibited binary and secret patterns..."
          PROHIBITED_EXTENSIONS=("*.key" "*.pem" "*.p12" "*.pkcs12" "*.sqlite3")
          FOUND=0
          for ext in "${PROHIBITED_EXTENSIONS[@]}"; do
            MATCHES=$(find . -not -path "*/.*" -name "$ext")
            if [ -n "$MATCHES" ]; then
              echo "::error::Prohibited file found: $MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No prohibited files or secrets detected."

  backend-quality:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Runtime & Development Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Environment & Installed Dependencies
        shell: bash
        run: |
          python -c "import django, rest_framework, networkx, osmnx, pytest, pytest_cov, ruff; print(f'Environment verification:\n- Python: {__import__(\"sys\").version}\n- Django: {django.__version__}\n- DRF: {rest_framework.__version__}\n- NetworkX: {networkx.__version__}\n- OSMnx: {osmnx.__version__}\n- Pytest: {pytest.__version__}\n- Pytest-Cov: {pytest_cov.__version__}')"

      - name: Run Ruff Linting
        shell: bash
        run: |
          ruff check backend

      - name: Run Django System Checks
        shell: bash
        run: |
          python backend/manage.py check

      - name: Run Full Automated Test Suite with Coverage (Phases 2-20)
        shell: bash
        run: |
          pytest --cov=backend/apps/core --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend-quality:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Inspect Frontend & Validate
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm ci
            npm run lint
            npm run typecheck
            npm run build
          else
            echo "Phase 19 verified: Pluggable AI Decision Policies for Autonomous Vehicle Agents active; frontend/package.json not yet declared. Node 22.x environment verified."
          fi

